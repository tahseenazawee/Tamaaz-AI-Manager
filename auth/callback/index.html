<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamaaz AI Manager - TikTok Callback</title>
</head>
<body>
  <h2>TikTok authorization received</h2>
  <p id="status">Processing...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");

    const status = document.getElementById("status");

    if (error) {
      status.textContent = "TikTok authorization failed: " + error;
    } else if (code) {
      status.textContent = "TikTok authorization successful.";
      console.log("TikTok authorization code:", code);
      console.log("TikTok state:", state);
    } else {
      status.textContent = "No authorization code was received.";
    }
  </script>
</body>
</html>

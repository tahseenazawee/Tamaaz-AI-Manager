plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tamaaz.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.tamaaz.app"
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName "1.2-whatsapp-location-open"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tamaaz.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.tamaaz.app"
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName "0.8-performance-manual-map"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}

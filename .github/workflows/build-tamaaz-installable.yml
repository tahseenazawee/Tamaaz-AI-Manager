name: Build TAMAAZ Installable APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        run: gradle -p android-app :app:assembleRelease

      - name: Create signing key
        run: |
          keytool -genkeypair -v \
            -keystore tamaaz-release.jks \
            -storepass tamaaz2026 \
            -keypass tamaaz2026 \
            -alias tamaaz \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=TAMAAZ Release,O=TAMAAZ,C=IQ"

      - name: Align APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            android-app/app/build/outputs/apk/release/app-release-unsigned.apk \
            TAMAAZ-aligned.apk

      - name: Sign APK with v1/v2/v3 schemes
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks tamaaz-release.jks \
            --ks-pass pass:tamaaz2026 \
            --key-pass pass:tamaaz2026 \
            --ks-key-alias tamaaz \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out TAMAAZ-INSTALL.apk \
            TAMAAZ-aligned.apk

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs TAMAAZ-INSTALL.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TAMAAZ-installable-apk
          path: TAMAAZ-INSTALL.apk
